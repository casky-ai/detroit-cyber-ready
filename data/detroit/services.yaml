# Twelve city services. 911 sits in its own life-safety tier above everything
# else — see plans/001_prd.md, "911 is the anchor". It renders as one box,
# same as every other service; there is no on-screen decomposition.
#
# resident_impact is authored, not computed, and is shown to the CISO
# verbatim. Each sentence is written to be read aloud.
#
# Locations for lat/lon are approximate public facility locations (city hall,
# DPD headquarters, etc.) and are for map placement only — see
# scripts/pull-detroit-geo.ts for the real, committed GeoJSON this eventually
# comes from.

- slug: 911-emergency-communications
  name: 911 Emergency Communications
  department: Detroit Public Safety / ITS
  criticality: life-safety
  impact_unit: dispatch delay and response time
  resident_impact: >
    Potential disruption to emergency call handling, dispatch, and response times.
  externally_exposed: false
  lat: 42.3298
  lon: -83.0458

- slug: police
  name: Police
  department: Detroit Police Department
  criticality: critical
  resident_impact: >
    Potential disruption to non-emergency reporting, records lookup, and
    officer support systems.
  externally_exposed: false
  lat: 42.3299
  lon: -83.0459

