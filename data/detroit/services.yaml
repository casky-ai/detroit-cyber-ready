# Twelve city services. 911 sits in its own life-safety tier above everything
# else — see plans/001_prd.md, "911 is the anchor". It renders as one marker
# on the map, same as every other service; there is no on-screen decomposition.
#
# resident_impact is authored, not computed, and is shown to the CISO
# verbatim. Each sentence is written to be read aloud, and is specific to
# what that department actually does — not a generic template.
#
# address and lat/lon are REAL, publicly documented city facility addresses,
# geocoded via OpenStreetMap Nominatim (not hand-guessed). Sourced from
# detroitmi.gov and public records, September 2026. These are the buildings
# that house the department, not a claim about where any particular server
# physically sits — the technology inventory in technologies.yaml remains
# entirely synthetic, per docs/connectors.md.

- slug: 911-emergency-communications
  name: 911 Emergency Communications
  department: Detroit Public Safety / ITS
  address: Detroit Public Safety Headquarters, 1301 3rd Street, Detroit, MI 48226
  criticality: life-safety
  impact_unit: dispatch delay and response time
  resident_impact: >
    Potential disruption to emergency call handling, dispatch, and response times.
  externally_exposed: false
  lat: 42.3300386
  lon: -83.0577532

